name: 功能建议 / Feature Request
description: 提出新功能建议 / Suggest a new feature
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的功能建议！请描述你希望看到的新功能。
        Thanks for your feature suggestion! Please describe the feature you'd like to see.

  - type: textarea
    id: problem
    attributes:
      label: 问题描述 / Problem Description
      description: 这个功能解决了什么问题？/ What problem does this solve?
      placeholder: "我希望能... / I would like to be able to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案 / Proposed Solution
      description: 你希望如何实现这个功能？ / How would you like this to be implemented?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives
      description: 你考虑过哪些替代方案？ / What alternatives have you considered?

  - type: textarea
    id: additional
    attributes:
      label: 补充信息 / Additional Context
      description: 其他参考信息、截图或链接 / Other references, screenshots or links
